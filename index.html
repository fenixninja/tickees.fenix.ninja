<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TICKEES — Smart Concert Tickets</title>
  <!-- Favicons -->
  <link rel="icon" type="image/x-icon" href="fenix_icons/favicon.ico">
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Outfit:wght@300;400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <!-- Estilos -->
  <link rel="stylesheet" href="style.css">
  <!-- Vendor WhatAuth & QR Code Styling -->
  <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
  <script src="vendor/qr-code-styling.js"></script>
  <script 
    src="vendor/whatauth.min.js" 
    data-type="pixel"
    data-domain="tickees.fenix.ninja"
    data-ws-url="https://api.whatauth.com" 
    data-storage="sessionStorage">
  </script>
</head>
<body>
  <!-- Header con título alineado a la izquierda arriba, ticker central y controles a la derecha -->
  <header class="header">
    <div class="header-left">
      <div class="title-container">
        <h1 class="logo-title">
          <span>TICK</span><span>EES</span>
        </h1>
      </div>
    </div>
    <!-- Announcement Bar / Top Bar con temática de tickets de conciertos -->
    <div class="header-center" id="announcementContainer">
      <div class="announcement-bar" role="region" aria-label="Anuncios de conciertos">
        <div class="announcement-badge">
          <span class="live-dot"></span>
          <span id="announcementBadgeText">LIVE</span>
        </div>
        <div class="announcement-ticker-wrapper">
          <div class="announcement-track" id="announcementTrack">
            <!-- Renderizado dinámico con conciertos y traducciones -->
          </div>
        </div>
      </div>
    </div>
    <div class="header-right">
      <!-- Botón Panel Mis Entradas -->
      <button id="btnMyTickets" class="btn-my-tickets" aria-label="Mis Entradas" title="Mis Entradas">
        <span class="btn-my-tickets-icon">🎟️</span>
        <span class="btn-my-tickets-label" id="lblMyTickets">Mis Entradas</span>
        <span id="badgeMyTickets" class="badge-tickets-count">0</span>
      </button>

      <div class="lang-selector-container">
        <select id="langSelect" class="lang-select" aria-label="Seleccionar idioma">
          <option value="es">🇪🇸 ES</option>
          <option value="en">🇺🇸 EN</option>
          <option value="de">🇩🇪 DE</option>
          <option value="fr">🇫🇷 FR</option>
          <option value="hi">🇮🇳 HI</option>
          <option value="zh">🇨🇳 ZH</option>
          <option value="ja">🇯🇵 JA</option>
        </select>
      </div>
    </div>
  </header>

  <!-- Contenedor principal donde se renderizan las tarjetas de concierto -->
  <main class="main-content">
    <section id="concertsContainer" class="concerts-grid">
      <!-- Tarjetas renderizadas dinámicamente con QR Pixel WhatAuth -->
    </section>
  </main>

  <!-- Drawer Deslizante de Mis Entradas (Wallet de Tickets) -->
  <div id="ticketsDrawerOverlay" class="drawer-overlay" aria-hidden="true"></div>
  <aside id="ticketsDrawer" class="tickets-drawer" aria-hidden="true" role="dialog" aria-labelledby="drawerTitle">
    <div class="drawer-header">
      <div class="drawer-title-group">
        <span class="drawer-icon">🎟️</span>
        <h2 id="drawerTitle">Mis Entradas</h2>
        <span id="drawerBadgeTotal" class="drawer-total-badge">0</span>
      </div>
      <button id="btnCloseDrawer" class="btn-close-drawer" aria-label="Cerrar">&times;</button>
    </div>
    
    <div class="drawer-body" id="drawerTicketsList">
      <!-- Renderizado dinámico de tickets adquiridos -->
    </div>

    <div class="drawer-footer" id="drawerFooter">
      <div class="drawer-summary">
        <span id="lblTotalSpent">Total:</span>
        <strong id="drawerTotalPrice">0.00 €</strong>
      </div>
      <div class="drawer-actions">
        <button id="btnClearTickets" class="btn-clear-wallet">Vaciar Cartera</button>
      </div>
    </div>
  </aside>

  <!-- Toast de Notificación Flotante -->
  <div id="toastNotification" class="toast-notification" aria-live="polite"></div>

  <!-- Footer con información del autor y repositorio -->
  <footer class="footer">
    <p>
      Autor: <a href="https://fenix.ninja" target="_blank" rel="noopener noreferrer" class="footer-link">fenix.ninja</a>
      <span class="footer-separator">•</span>
      Código en <a href="https://github.com/fenixninja/tickees.fenix.ninja" target="_blank" rel="noopener noreferrer" class="footer-link footer-github"><svg class="github-icon" viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>GitHub</a>
    </p>
  </footer>

  <script src="index.js"></script>
</body>
</html>
